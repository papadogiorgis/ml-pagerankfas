[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagerankfas"
version = "0.1.0"
description = "A modular implementation of PageRankFAS with ML enhancements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.22.0",
]
authors = [
    {name = "Georgios Papadakis", email = "papadakiss.giorgiss@gmail.com"},
    {name = "Dr. Panagiotis Lionakis", email = "lionakispan@gmail.com"},
]
license-files = ["LICENSE"]